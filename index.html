<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>СДЕЛАНО SALYSHIN — Тосик</title>
<style>
  :root {
    --red: #ff1a2e;
    --red-soft: #ff4d5e;
    --bg: #000;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #fff;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255, 0, 30, 0.22), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(255, 0, 30, 0.12), transparent 60%),
      linear-gradient(rgba(255, 0, 30, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 0, 30, 0.05) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px;
    z-index: 0;
    animation: gridMove 6s linear infinite;
    pointer-events: none;
  }
  @keyframes gridMove {
    from { background-position: 0 0, 0 0, 0 0, 0 0; }
    to { background-position: 0 0, 0 0, 0 44px, 44px 0; }
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.0) 0, rgba(0,0,0,0.0) 2px, rgba(0,0,0,0.18) 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
    mix-blend-mode: multiply;
  }

  #fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    overflow: hidden;
    pointer-events: none;
  }
  .flyer {
    position: absolute;
    left: 0;
    top: 0;
    white-space: nowrap;
    font-weight: 800;
    letter-spacing: 0.3px;
    padding: 4px 10px;
    border-radius: 8px;
    will-change: transform;
    pointer-events: none;
    backface-visibility: hidden;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 8px 6px;
    text-align: center;
    pointer-events: none;
  }
  .title {
    position: relative;
    display: inline-block;
    margin: 0;
    font-family: Impact, "Arial Black", "Segoe UI Black", sans-serif;
    font-weight: 900;
    font-size: clamp(30px, 8.2vw, 120px);
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: #ffd6da;
    text-shadow:
      0 0 6px #fff,
      0 0 14px var(--red),
      0 0 28px var(--red),
      0 0 54px var(--red),
      0 0 90px #ff0022,
      0 0 140px #ff0022;
    animation: neonPulse 2.2s ease-in-out infinite, titleFloat 4s ease-in-out infinite, flicker 7s infinite;
  }
  .title::before, .title::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
  }
  .title::before {
    color: #00e5ff;
    text-shadow: none;
    transform: translate(-3px, 0);
    mix-blend-mode: screen;
    animation: glitchA 2.6s infinite steps(1);
  }
  .title::after {
    color: #ff0040;
    text-shadow: none;
    transform: translate(3px, 0);
    mix-blend-mode: screen;
    animation: glitchB 3.1s infinite steps(1);
  }
  @keyframes neonPulse {
    0%, 100% { filter: brightness(1) saturate(1.1); }
    50% { filter: brightness(1.35) saturate(1.5); }
  }
  @keyframes titleFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(5px) scale(1.025); }
  }
  @keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.55; }
  }
  @keyframes glitchA {
    0% { clip-path: inset(0 0 100% 0); transform: translate(0, 0); }
    4% { clip-path: inset(12% 0 70% 0); transform: translate(-6px, 1px); }
    8% { clip-path: inset(55% 0 20% 0); transform: translate(5px, -1px); }
    12% { clip-path: inset(0 0 100% 0); transform: translate(0, 0); }
    60% { clip-path: inset(0 0 100% 0); }
    63% { clip-path: inset(30% 0 45% 0); transform: translate(-8px, 0); }
    67% { clip-path: inset(75% 0 5% 0); transform: translate(6px, 2px); }
    71% { clip-path: inset(0 0 100% 0); transform: translate(0, 0); }
    100% { clip-path: inset(0 0 100% 0); }
  }
  @keyframes glitchB {
    0% { clip-path: inset(0 0 100% 0); }
    10% { clip-path: inset(40% 0 40% 0); transform: translate(7px, 0); }
    14% { clip-path: inset(5% 0 80% 0); transform: translate(-5px, 1px); }
    18% { clip-path: inset(0 0 100% 0); transform: translate(0, 0); }
    75% { clip-path: inset(0 0 100% 0); }
    78% { clip-path: inset(60% 0 15% 0); transform: translate(9px, -1px); }
    82% { clip-path: inset(20% 0 60% 0); transform: translate(-7px, 0); }
    86% { clip-path: inset(0 0 100% 0); }
    100% { clip-path: inset(0 0 100% 0); }
  }
  .subtitle {
    margin: 6px 0 0;
    font-size: clamp(11px, 2.2vw, 18px);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--red-soft);
    text-shadow: 0 0 8px var(--red), 0 0 18px var(--red);
    animation: subBlink 1.6s steps(2) infinite;
  }
  @keyframes subBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }

  body.paused .title,
  body.paused .title::before,
  body.paused .title::after,
  body.paused .subtitle,
  body.paused::before {
    animation-play-state: paused;
  }

  .panel {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    transform: translateX(-50%);
    z-index: 30;
    width: min(96vw, 900px);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
    padding: 10px;
    border: 1px solid rgba(255, 26, 46, 0.55);
    border-radius: 16px;
    background: rgba(10, 0, 2, 0.72);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    box-shadow: 0 0 18px rgba(255, 0, 30, 0.45), inset 0 0 18px rgba(255, 0, 30, 0.15);
  }
  .btn {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    font: inherit;
    font-weight: 800;
    font-size: clamp(11px, 3vw, 14px);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--red);
    background: linear-gradient(180deg, rgba(255, 26, 46, 0.35), rgba(120, 0, 10, 0.35));
    text-shadow: 0 0 8px var(--red);
    box-shadow: 0 0 10px rgba(255, 0, 30, 0.6), inset 0 0 10px rgba(255, 0, 30, 0.35);
    transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .btn:hover {
    box-shadow: 0 0 22px rgba(255, 0, 30, 0.95), inset 0 0 14px rgba(255, 0, 30, 0.55);
    background: linear-gradient(180deg, rgba(255, 26, 46, 0.55), rgba(160, 0, 14, 0.5));
  }
  .btn:active { transform: scale(0.95); }
  .btn.on {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.25), rgba(255, 26, 46, 0.6));
  }
  .speed {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border: 1px solid rgba(255, 26, 46, 0.6);
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--red-soft);
    text-shadow: 0 0 6px var(--red);
  }
  .speed input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: clamp(90px, 26vw, 170px);
    height: 6px;
    border-radius: 6px;
    background: rgba(255, 26, 46, 0.35);
    outline: none;
    box-shadow: 0 0 8px rgba(255, 0, 30, 0.7);
  }
  .speed input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--red);
    box-shadow: 0 0 12px var(--red), 0 0 24px var(--red);
    cursor: pointer;
  }
  .speed input[type=range]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--red);
    box-shadow: 0 0 12px var(--red), 0 0 24px var(--red);
    cursor: pointer;
  }
  .speed output { min-width: 34px; text-align: right; color: #fff; }
  .counter {
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px dashed rgba(255, 26, 46, 0.7);
    font-size: clamp(11px, 3vw, 14px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #fff;
    text-shadow: 0 0 8px var(--red);
  }
  .counter b {
    color: var(--red-soft);
    font-size: 1.2em;
    text-shadow: 0 0 10px var(--red), 0 0 20px var(--red);
  }
  .hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
    z-index: 5;
    text-align: center;
    font-size: 11px;
    color: rgba(255, 90, 105, 0.0);
    pointer-events: none;
  }
  @media (max-width: 520px) {
    .panel { gap: 6px; padding: 8px; }
    .btn { padding: 10px 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .title, .title::before, .title::after, .subtitle, body::before { animation: none; }
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>
<div id="stage"></div>

<header>
  <h1 class="title" data-text="СДЕЛАНО SALYSHIN">СДЕЛАНО SALYSHIN</h1>
  <p class="subtitle">мемные оскорбления Тосика</p>
</header>

<div class="panel" id="panel">
  <button class="btn" id="moreBtn" type="button">ЕЩЁ БОЛЬШЕ КРИНЖА</button>
  <button class="btn" id="pauseBtn" type="button">ОСТАНОВИТЬ ХАОС</button>
  <label class="speed">
    <span>Скорость</span>
    <input type="range" id="speed" min="0.2" max="4" step="0.1" value="1">
    <output id="speedVal">1.0x</output>
  </label>
  <button class="btn" id="fsBtn" type="button">Полный экран</button>
  <div class="counter">Надписей: <b id="count">0</b></div>
</div>

<script>
(function () {
  "use strict";

  var PHRASES = [
    "Тосик собака 🐕",
    "Тосик картошка 🥔",
    "Тосик тапок без пары 🩴",
    "Тосик дошик без кипятка 🍜",
    "Тосик NPC из деревни",
    "Тосик бублик с интеллектом табуретки",
    "Тосик Wi-Fi без интернета 📡",
    "Тосик пельмень недоваренный",
    "Тосик кринж на ножках",
    "Тосик будильник без батареек",
    "Тосик потерянный носок",
    "Тосик голубь с района 🐦",
    "Тосик баг в человеческой версии",
    "Тосик огурец с амбициями 🥒",
    "Тосик загрузка 1%",
    "Тосик чебурек без начинки",
    "Тосик мозг на техобслуживании",
    "Тосик босс последнего уровня в детском саду",
    "Тосик пульт без кнопок",
    "Тосик легенда двора, которого никто не знает",
    "Тосик шнурок без кроссовка",
    "Тосик сырник без творога",
    "Тосик ошибка 404: мозг не найден",
    "Тосик сухарик в супе",
    "Тосик кабачок на максималках",
    "Тосик компьютер на картошке 🥔",
    "Тосик ходячий минус вайб",
    "Тосик ластик судьбы",
    "Тосик батон с Bluetooth",
    "Тосик главный герой побочного квеста",
    "Тосик, ты мыслишь в демоверсии.",
    "Тосик настолько NPC, что диалоги с ним пропускают.",
    "Тосик, у тебя Wi-Fi ловит лучше, чем мысли.",
    "Тосик — чемпион мира по кринжу 💀",
    "Тосик.exe перестал отвечать.",
    "Тосик, ты загрузился, но не до конца.",
    "Тосик — ходячая ошибка системы."
  ];

  var COLORS = [
    "#ff1a2e", "#ff4d5e", "#ff0066", "#ff7a00", "#ffd000",
    "#00f0ff", "#39ff14", "#ff00e6", "#b14dff", "#ffffff", "#ff3b3b"
  ];

  var stage = document.getElementById("stage");
  var canvas = document.getElementById("fx");
  var ctx = canvas.getContext("2d");
  var countEl = document.getElementById("count");
  var moreBtn = document.getElementById("moreBtn");
  var pauseBtn = document.getElementById("pauseBtn");
  var fsBtn = document.getElementById("fsBtn");
  var speedInput = document.getElementById("speed");
  var speedVal = document.getElementById("speedVal");
  var panel = document.getElementById("panel");

  var W = window.innerWidth;
  var H = window.innerHeight;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var isSmall = Math.min(W, H) < 600;
  var MAX_FLYERS = 260;
  var MAX_PARTICLES = 700;

  var flyers = [];
  var particles = [];
  var paused = false;
  var speed = 1;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  /* ---------- canvas ---------- */
  function resizeCanvas() {
    W = window.innerWidth;
    H = window.innerHeight;
    isSmall = Math.min(W, H) < 600;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (var i = 0; i < flyers.length; i++) {
      var f = flyers[i];
      f.x = Math.min(Math.max(0, f.x), Math.max(0, W - f.w));
      f.y = Math.min(Math.max(0, f.y), Math.max(0, H - f.h));
    }
  }

  /* ---------- glow sprites ---------- */
  var sprites = {};
  function makeSprite(color) {
    var s = 64;
    var c = document.createElement("canvas");
    c.width = c.height = s;
    var g = c.getContext("2d");
    var grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(0.18, color);
    grad.addColorStop(0.5, color + "66");
    grad.addColorStop(1, color + "00");
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
    return c;
  }
  COLORS.forEach(function (c) { sprites[c] = makeSprite(c); });

  /* ---------- particles ---------- */
  function addAmbient(n) {
    for (var i = 0; i < n; i++) {
      var col = Math.random() < 0.7 ? "#ff1a2e" : pick(COLORS);
      particles.push({
        x: rand(0, W), y: rand(0, H),
        vx: rand(-14, 14), vy: rand(-30, -6),
        size: rand(6, 20),
        life: 1, max: 1,
        ambient: true,
        tw: rand(0, 6.28),
        sprite: sprites[col]
      });
    }
  }

  function burst(x, y) {
    var n = isSmall ? 26 : 38;
    for (var i = 0; i < n; i++) {
      if (particles.length >= MAX_PARTICLES) break;
      var a = rand(0, Math.PI * 2);
      var v = rand(60, 360);
      var col = Math.random() < 0.45 ? "#ff1a2e" : pick(COLORS);
      var life = rand(0.7, 1.5);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        size: rand(10, 34),
        life: life, max: life,
        ambient: false,
        sprite: sprites[col]
      });
    }
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      if (p.ambient) {
        p.x += p.vx * dt * speed;
        p.y += p.vy * dt * speed;
        p.tw += dt * 2 * speed;
        if (p.y < -30) { p.y = H + 30; p.x = rand(0, W); }
        if (p.x < -30) p.x = W + 30;
        if (p.x > W + 30) p.x = -30;
      } else {
        var k = Math.pow(0.12, dt * speed);
        p.vx *= k;
        p.vy = p.vy * k + 160 * dt * speed;
        p.x += p.vx * dt * speed;
        p.y += p.vy * dt * speed;
        p.life -= dt * speed;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }
  }

  function drawParticles() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var alpha, size = p.size;
      if (p.ambient) {
        alpha = 0.25 + 0.25 * Math.sin(p.tw);
      } else {
        var t = p.life / p.max;
        alpha = Math.max(0, Math.min(1, t * 1.2));
        size = p.size * (0.4 + t * 0.7);
      }
      ctx.globalAlpha = alpha;
      ctx.drawImage(p.sprite, p.x - size, p.y - size, size * 2, size * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  /* ---------- flyers ---------- */
  function updateCount() {
    countEl.textContent = flyers.length;
  }

  function createFlyer(text) {
    var el = document.createElement("div");
    el.className = "flyer";
    el.textContent = text || pick(PHRASES);

    var base = isSmall ? rand(13, 26) : rand(15, 40);
    var color = pick(COLORS);
    el.style.fontSize = base.toFixed(1) + "px";
    el.style.color = color;
    el.style.textShadow =
      "0 0 4px " + color + ", 0 0 10px " + color + ", 0 0 22px " + color;
    if (Math.random() < 0.25) {
      el.style.border = "1px solid " + color;
      el.style.boxShadow = "0 0 8px " + color + ", inset 0 0 8px " + color + "55";
      el.style.background = "rgba(0,0,0,0.35)";
    }
    stage.appendChild(el);

    var w = el.offsetWidth;
    var h = el.offsetHeight;
    var angle = rand(0, Math.PI * 2);
    var spd = rand(50, 230) * (isSmall ? 0.8 : 1);
    var f = {
      el: el,
      w: w,
      h: h,
      x: rand(0, Math.max(1, W - w)),
      y: rand(0, Math.max(1, H - h)),
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      rot: rand(-7, 7),
      rotV: rand(-12, 12),
      rotBase: 0
    };
    if (Math.abs(f.vx) < 25) f.vx = f.vx < 0 ? -25 : 25;
    if (Math.abs(f.vy) < 25) f.vy = f.vy < 0 ? -25 : 25;
    flyers.push(f);
    place(f);
    return f;
  }

  function place(f) {
    f.el.style.transform =
      "translate3d(" + f.x.toFixed(1) + "px," + f.y.toFixed(1) + "px,0) rotate(" + f.rot.toFixed(2) + "deg)";
  }

  function updateFlyers(dt) {
    var s = dt * speed;
    for (var i = 0; i < flyers.length; i++) {
      var f = flyers[i];
      f.x += f.vx * s;
      f.y += f.vy * s;
      var maxX = W - f.w;
      var maxY = H - f.h;
      if (maxX < 0) maxX = 0;
      if (maxY < 0) maxY = 0;
      var bounced = false;
      if (f.x <= 0) { f.x = 0; f.vx = Math.abs(f.vx); bounced = true; }
      else if (f.x >= maxX) { f.x = maxX; f.vx = -Math.abs(f.vx); bounced = true; }
      if (f.y <= 0) { f.y = 0; f.vy = Math.abs(f.vy); bounced = true; }
      else if (f.y >= maxY) { f.y = maxY; f.vy = -Math.abs(f.vy); bounced = true; }
      f.rot += f.rotV * s * 0.25;
      if (f.rot > 8) f.rotV = -Math.abs(f.rotV);
      if (f.rot < -8) f.rotV = Math.abs(f.rotV);
      if (bounced) f.rotV = rand(-14, 14);
      place(f);
    }
  }

  function spawnMore(n) {
    var added = 0;
    for (var i = 0; i < n; i++) {
      if (flyers.length >= MAX_FLYERS) break;
      createFlyer();
      added++;
    }
    updateCount();
    return added;
  }

  /* ---------- main loop ---------- */
  var last = performance.now();
  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    if (!paused) {
      updateFlyers(dt);
      updateParticles(dt);
    }
    drawParticles();
    requestAnimationFrame(frame);
  }

  /* ---------- controls ---------- */
  moreBtn.addEventListener("click", function () {
    var n = isSmall ? 8 : 12;
    var added = spawnMore(n);
    var r = moreBtn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
    if (added === 0) {
      moreBtn.textContent = "КРИНЖА МАКСИМУМ 💀";
    }
  });

  pauseBtn.addEventListener("click", function () {
    paused = !paused;
    document.body.classList.toggle("paused", paused);
    pauseBtn.classList.toggle("on", paused);
    pauseBtn.textContent = paused ? "ВОЗОБНОВИТЬ ХАОС" : "ОСТАНОВИТЬ ХАОС";
  });

  speedInput.addEventListener("input", function () {
    speed = parseFloat(speedInput.value);
    speedVal.textContent = speed.toFixed(1) + "x";
  });

  function isFullscreen() {
    return document.fullscreenElement || document.webkitFullscreenElement;
  }
  fsBtn.addEventListener("click", function () {
    var de = document.documentElement;
    try {
      if (!isFullscreen()) {
        var req = de.requestFullscreen || de.webkitRequestFullscreen || de.msRequestFullscreen;
        if (req) { var p = req.call(de); if (p && p.catch) p.catch(function () {}); }
      } else {
        var ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        if (ex) { var q = ex.call(document); if (q && q.catch) q.catch(function () {}); }
      }
    } catch (e) {}
  });
  function onFsChange() {
    fsBtn.textContent = isFullscreen() ? "Выйти из полного" : "Полный экран";
  }
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);

  /* click / tap -> neon particles */
  window.addEventListener("pointerdown", function (e) {
    if (panel.contains(e.target)) return;
    burst(e.clientX, e.clientY);
  }, { passive: true });

  /* resize */
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resizeCanvas();
      for (var i = 0; i < flyers.length; i++) {
        flyers[i].w = flyers[i].el.offsetWidth;
        flyers[i].h = flyers[i].el.offsetHeight;
      }
    }, 80);
  });
  window.addEventListener("orientationchange", function () {
    setTimeout(resizeCanvas, 200);
  });

  /* ---------- init ---------- */
  resizeCanvas();
  addAmbient(isSmall ? 35 : 70);
  PHRASES.forEach(function (t) { createFlyer(t); });
  updateCount();
  requestAnimationFrame(function (t) { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
